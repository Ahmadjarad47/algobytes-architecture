services:
  postgres:
    image: postgres:17-alpine
    container_name: algo-postgres
    environment:
      POSTGRES_DB: algo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d algo"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: algo-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    container_name: algo-backend
    build:
      context: .
      dockerfile: src/algo.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=algo;Username=postgres;Password=postgres
      ConnectionStrings__Redis: redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5244:8080"

  frontend:
    container_name: algo-frontend
    build:
      context: ./ui/algo.ui
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
    depends_on:
      backend:
        condition: service_started
    ports:
      - "4200:4000"

volumes:
  postgres-data:
